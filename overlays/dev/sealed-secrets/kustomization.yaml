apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# gami-secrets.yaml holds NEXTAUTH_SECRET only — gami-api's
# GAMI_JWT_SECRET/GAMI_API_TOKEN are gone along with gami-api itself (see
# README.md). Independently generated from staging/production's, never
# copied over.
#
# gami-postgres-app.yaml — since dev's Postgres is now a plain Deployment
# (../postgres.yaml), not CNPG, there's no operator to auto-generate this
# Secret anymore. Holds POSTGRES_DB/POSTGRES_USER/POSTGRES_PASSWORD (the
# postgres container's own bootstrap env vars) plus `uri` (the full
# connection string gami-webapp/gami-migrate read via secretKeyRef) — one
# Secret, both purposes.
#
# gami-smtp.yaml not sealed yet — add it here once real SMTP credentials
# are provided (see README-dev.md's secrets bootstrap section).
#
# No gami-signing-key.yaml — institution signing keys are per-institution
# application data now (managed in Postgres, see gami-app's
# src/lib/institution-keys.ts), not a single cluster-wide Secret.
resources:
  - gami-secrets.yaml
  - gami-postgres-app.yaml
