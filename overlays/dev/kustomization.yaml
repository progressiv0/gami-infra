apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overrides base's `namespace: gami` — dev/staging/production share one
# cluster (3-node k3s), so they need separate namespaces or resource names
# would collide.
namespace: gami-dev

resources:
  - ../../base
  - sealed-secrets
  - postgres-cluster.yaml

# See overlays/production/kustomization.yaml for why this is disabled.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: gami-config
    literals:
      - NODE_ENV=development
      - CORS_ALLOWED_ORIGIN=https://dev.authenticmemory.org
      - APP_BASE_URL=https://dev.authenticmemory.org
      - NEXTAUTH_URL=https://dev.authenticmemory.org
      - SECURE_COOKIES=true
      - AUTH_TRUST_HOST=true
      - SMTP_HOST=smtp.example.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_FROM=noreply@authenticmemory.org
      - SMTP_FROM_NAME=Authentic Memory (dev)
      - BOOTSTRAP_OPERATOR_EMAIL=tech@authenticmemory.org

images:
  - name: ghcr.io/authenticmemory/gami-webapp
    newTag: latest
  - name: ghcr.io/authenticmemory/gami-webapp-migrate
    newName: ghcr.io/authenticmemory/gami-webapp
    newTag: latest-migrate

replicas:
  - name: gami-webapp
    count: 1

# Dev gets its own hostnames and the Let's Encrypt STAGING ACME endpoint —
# same untrusted-but-functional-certs reasoning as the staging overlay, dev
# doesn't need real browser-trusted certs either.
patches:
  # gami-migrate-job.yaml (base/, sync-wave 0) reads this ConfigMap via
  # envFrom, so it needs to exist first — wave -1 guarantees that within
  # ArgoCD's normal Sync phase (see base/gami-migrate-job.yaml's comment for
  # why this is plain sync-wave ordering, not a PreSync hook: hooks run in a
  # separate phase that completes before ANY Sync-phase resource, including
  # this ConfigMap, is even attempted — confirmed against a real cluster).
  - target:
      kind: ConfigMap
      name: gami-config
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: gami-config
        annotations:
          argocd.argoproj.io/sync-wave: "-1"
  - target:
      kind: Ingress
      name: gami-webapp
    patch: |
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: gami-webapp
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-staging
      spec:
        tls:
          - hosts:
              - dev.authenticmemory.org
              - verify-dev.authenticmemory.org
            secretName: gami-webapp-tls
        rules:
          - host: dev.authenticmemory.org
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: gami-webapp
                      port:
                        number: 3000
          - host: verify-dev.authenticmemory.org
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: gami-webapp
                      port:
                        number: 3000
  # Node topology (README.md): dev's own pod PREFERS the dev node — a soft
  # preference (preferredDuringScheduling), not a hard requirement, so a
  # temporarily-unschedulable dev node doesn't just leave it Pending forever.
  # Deliberately different from production's podAntiAffinity (see
  # overlays/production/kustomization.yaml), which spreads prod across all 3
  # nodes for real redundancy — dev doesn't need that, it just needs to
  # normally stay off the other two nodes' resources.
  #
  # sync-wave 1: ArgoCD waits for wave 0 (gami-migrate-job.yaml's Job) to
  # report Healthy — which for a Job means Completed — before starting this
  # wave. This is what actually blocks the webapp rollout until migration
  # succeeds, replacing the PreSync-hook mechanism this used to rely on.
  - target:
      kind: Deployment
      name: gami-webapp
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: gami-webapp
        annotations:
          argocd.argoproj.io/sync-wave: "1"
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: env
                          operator: In
                          values: ["dev"]
