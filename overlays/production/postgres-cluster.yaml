# Production's Postgres — the only environment with HA + S3 backup. Two
# layers of redundancy, deliberately:
#   - CloudNativePG replicates at the Postgres level (streaming replication,
#     automatic failover if the primary dies).
#   - `topologyKey: kubernetes.io/hostname` spreads the 3 instances across
#     all 3 nodes (dev/staging/prod), never doubling up on one — this is
#     the same mechanism that lets prod's webapp/api replicas spread across
#     all 3 nodes too (see the podAntiAffinity patch in kustomization.yaml).
#     Losing the prod node specifically still leaves 2 of 3 Postgres
#     instances up, on the dev/staging nodes.
# Requires the CloudNativePG operator AND the Barman Cloud CNPG-I plugin
# (`plugin-barman-cloud`) installed in the cluster — see the barmanObjectName
# reference below and hetzner-postgres-backup-creds.yaml (Secret, created
# out of band, never committed — see README-production.md's backup section).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gami-postgres
spec:
  instances: 3
  affinity:
    topologyKey: kubernetes.io/hostname
  storage:
    storageClass: longhorn
    size: 10Gi
  bootstrap:
    initdb:
      database: gami
      owner: gami
      # CNPG auto-generates the `gami` user's password and publishes a
      # Secret named `gami-postgres-app` (the `-app` suffix is a CNPG
      # convention), which gami-webapp/gami-migrate reference via
      # secretKeyRef (key: uri). Verify the exact key name against your
      # installed CNPG version.
  postgresql:
    pg_hba:
      - host gami gami 10.0.0.0/8 scram-sha-256
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: gami-postgres-backup-store
---
# S3-compatible object storage target for backups — same Hetzner Object
# Storage account/bucket already used for Terraform state
# (terraform/backend.tf's "gami-tfstate" bucket), under its own key prefix
# so backup data and Terraform state stay clearly separated within the one
# bucket.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: gami-postgres-backup-store
spec:
  configuration:
    destinationPath: "s3://gami-tfstate/postgres-backups/production"
    endpointURL: "https://fsn1.your-objectstorage.com"
    s3Credentials:
      accessKeyId:
        name: gami-postgres-backup-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: gami-postgres-backup-creds
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
  retentionPolicy: "30d"
---
# Nightly scheduled backup — the safety net that doesn't depend on anyone
# remembering to click a button. Runs at 02:00 daily (low-traffic window).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: gami-postgres-nightly
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: gami-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
