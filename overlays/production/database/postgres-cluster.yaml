# Production's Postgres — the only environment with backup. Single
# instance (`instances: 1`): production is its own single-node cluster now,
# so there's no second node for CloudNativePG to stream-replicate to —
# durability comes entirely from the continuous WAL archiving + nightly
# base backup below, not from live replication. No `affinity` block either
# (nothing to spread across).
#
# Continuous, transaction-granularity point-in-time recovery, not just a
# once-a-day snapshot: the Barman plugin below already runs
# `isWALArchiver: true`, which ships completed WAL segments to S3
# continuously — but Postgres only "completes" a segment once it fills to
# 16MB or `archive_timeout` elapses (default: disabled). For a batch-driven
# workload, that could leave a batch's committed transactions unarchived
# for a long time if it doesn't happen to fill a segment. `archive_timeout:
# 60s` below forces a WAL push on a timer regardless of fullness, bounding
# data loss to about a minute automatically — no per-batch scripting, no
# app-side changes. This is what actually controls recovery granularity;
# the nightly ScheduledBackup below only controls how much WAL has to be
# replayed during a restore (faster restores), not how recent the
# recoverable point is. If the app ever needs a guaranteed zero-lag
# checkpoint right after a specific batch, it can call `SELECT
# pg_switch_wal();` after commit to force that segment out immediately —
# not required for the automatic behavior above, just an available option.
#
# Requires the CloudNativePG operator AND the Barman Cloud CNPG-I plugin
# (`plugin-barman-cloud`) installed in the cluster — see the barmanObjectName
# reference below and hetzner-postgres-backup-creds.yaml (Secret, created
# out of band, never committed — see README-backup.md in this directory).
#
# Deployed by its own ArgoCD Application (argocd/app-gami-production-database.yaml),
# separate from gami-webapp/gami-migrate (../webapp/) — this lets the
# database exist and get backed up now, ahead of the web app's own rollout.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gami-postgres
spec:
  instances: 1
  storage:
    storageClass: local-path
    size: 20Gi
  bootstrap:
    initdb:
      database: gami
      owner: gami
      # CNPG auto-generates the `gami` user's password and publishes a
      # Secret named `gami-postgres-app` (the `-app` suffix is a CNPG
      # convention), which gami-webapp/gami-migrate reference via
      # secretKeyRef (key: uri). Verify the exact key name against your
      # installed CNPG version.
  postgresql:
    pg_hba:
      - host gami gami 10.0.0.0/8 scram-sha-256
    parameters:
      archive_timeout: "60s"
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: gami-postgres-backup-store
---
# S3-compatible object storage target for backups — same Hetzner Object
# Storage bucket already used for Terraform state
# (terraform/backend.tf's "gami-prod-backup" bucket), under its own key
# prefix so backup data and Terraform state stay clearly separated within
# the one bucket.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: gami-postgres-backup-store
spec:
  configuration:
    destinationPath: "s3://gami-prod-backup/postgres-backups"
    endpointURL: "https://fsn1.your-objectstorage.com"
    s3Credentials:
      accessKeyId:
        name: gami-postgres-backup-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: gami-postgres-backup-creds
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
  retentionPolicy: "30d"
---
# Nightly scheduled backup — the safety net that doesn't depend on anyone
# remembering to click a button. Runs at 02:00 daily (low-traffic window).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: gami-postgres-nightly
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: gami-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
