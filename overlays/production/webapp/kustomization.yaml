apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Split out from overlays/production/database/ deliberately — see that
# directory's kustomization.yaml comment. This half is gami-webapp/
# gami-migrate only; Postgres lives entirely in the sibling database/
# directory/Application now. Deployed later, once the app itself is ready
# (see argocd/app-gami-production-webapp.yaml's own comment).
resources:
- ../../../base
- sealed-secrets

# base/ already reflects production's hostnames (app.authenticmemory.org /
# verify.authenticmemory.org) and cert-manager issuer (letsencrypt-production)
# as its defaults, so no Ingress patch is needed here — only staging/dev
# patch away from those defaults.

# disableNameSuffixHash: envFrom.configMapRef.name references below don't get
# auto-rewritten to a hash-suffixed name by this kustomize version (verified
# with `kubectl kustomize` — the ConfigMap got suffixed but the Deployment's
# envFrom didn't follow, which 404s at apply time). Trade-off: pods don't
# auto-restart when gami-config's content changes — same manual-restart
# caveat Phase 3a already calls out for Secret rotation.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- literals:
  - NODE_ENV=production
  - CORS_ALLOWED_ORIGIN=https://app.authenticmemory.org
  - APP_BASE_URL=https://app.authenticmemory.org
  - NEXTAUTH_URL=https://app.authenticmemory.org
  - SECURE_COOKIES=true
  - AUTH_TRUST_HOST=true
  - SMTP_HOST=smtp-relay.gmail.com
  - SMTP_PORT=587
  - SMTP_SECURE=false
  - SMTP_FROM=noreply@authenticmemory.org
  - SMTP_FROM_NAME=Authentic Memory
  - BOOTSTRAP_OPERATOR_EMAIL=tech@authenticmemory.org
  name: gami-config

# Rewritten by the manual production deploy: pushing to gami-app's `main`
# only BUILDS `main-<short-sha>`, it never deploys. Running the
# "Deploy to production" workflow (workflow_dispatch — the button) commits
# the chosen tag here, and ArgoCD syncs it. The tag below is only the
# starting point; don't hand-edit it.
#
# Rollback is that same button with an older tag: tags are unique per build
# and never reused, so any previously deployed image stays addressable. That
# immutability is also why nothing sets imagePullPolicy: Always.
# One entry covers both the Deployment and the migrate Job.
images:
- name: ghcr.io/authenticmemory/gami-webapp
  newName: ghcr.io/authenticmemory/gami-webapp
  newTag: main-b382138

# No replicas override — base/'s own default (1) is correct here now.
# Production's cluster has exactly one node, so podAntiAffinity-based
# node-spread HA (the old 3-replicas-across-3-nodes design) no longer means
# anything; a pod crash still gets Kubernetes' normal restart, just without
# zero-downtime failover. gami-app dropped the old Go backend service — see
# README.md — so gami-webapp (Next.js) is the whole app now.

  # gami-migrate-job.yaml (base/, sync-wave 0) reads this ConfigMap via
  # envFrom, so it needs to exist first — wave -1 guarantees that within
  # ArgoCD's normal Sync phase (see base/gami-migrate-job.yaml's comment for
  # why this is plain sync-wave ordering, not a PreSync hook: hooks run in a
  # separate phase that completes before ANY Sync-phase resource, including
  # this ConfigMap, is even attempted — confirmed against a real cluster).
  # sync-wave 1: ArgoCD waits for wave 0 (gami-migrate-job.yaml's Job) to
  # report Healthy — which for a Job means Completed — before starting this
  # wave. This is what actually blocks the webapp rollout until migration
  # succeeds, replacing the PreSync-hook mechanism this used to rely on.
  # No podAntiAffinity here anymore — production's cluster has exactly one
  # node, so there's nothing to spread across.
patches:
- patch: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: gami-config
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
  target:
    kind: ConfigMap
    name: gami-config
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: gami-webapp
      annotations:
        argocd.argoproj.io/sync-wave: "1"
  target:
    kind: Deployment
    name: gami-webapp
