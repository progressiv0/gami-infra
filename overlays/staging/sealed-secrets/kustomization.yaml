apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# gami-secrets.yaml holds NEXTAUTH_SECRET only — gami-api's
# GAMI_JWT_SECRET/GAMI_API_TOKEN are gone along with gami-api itself (see
# README.md). Independently generated from production's, never copied over.
# Sealed against staging's OWN Sealed Secrets controller — a fresh
# controller/keypair, distinct from production's (see
# cluster-operators/apps-staging/sealed-secrets.yaml).
#
# No gami-postgres-app.yaml — staging's Postgres is CNPG now (see
# ../postgres-cluster.yaml), which auto-generates and manages that Secret
# itself; there's no operator-less plain Deployment here anymore to hand-seal
# one for.
#
# No gami-smtp.yaml — staging uses Mailpit (../mailpit.yaml) as its SMTP
# catcher, so there are no real SMTP credentials to seal.
#
# No gami-signing-key.yaml — institution signing keys are per-institution
# application data now (managed in Postgres, see gami-app's
# src/lib/institution-keys.ts), not a single cluster-wide Secret.
resources:
  - gami-secrets.yaml
