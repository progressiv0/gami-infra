# Staging's SMTP catcher — same reasoning as dev's used to be (see git
# history for overlays/dev/mailpit.yaml): outbound email (magic-link
# sign-in, DID-publish notices) is captured here instead of actually being
# sent anywhere, since staging has no real SMTP credentials. Deliberately
# NOT exposed via NodePort/Ingress — it captures real single-use sign-in
# links. Reach the web UI with `kubectl port-forward -n gami-staging
# svc/mailpit 8025:8025` when you need to read a captured email, rather
# than a standing exposed port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    app: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:latest
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          securityContext:
            runAsNonRoot: true
            # axllent/mailpit's image defaults to root (UID 0) — without an
            # explicit runAsUser, runAsNonRoot: true fails every container
            # start ("container has runAsNonRoot and image will run as
            # root"), confirmed against a real cluster. Both of Mailpit's
            # ports (1025, 8025) are unprivileged, so any non-root UID works;
            # 1000 is an arbitrary but conventional choice.
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    app: mailpit
spec:
  # ClusterIP (default) — internal-only, same reasoning as gami-api's old
  # Service before it was removed: nothing outside the cluster should reach
  # this directly. Use port-forward for occasional access to the web UI.
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
