# Staging's own single-instance Postgres — a plain, unmanaged Postgres
# Deployment (no CNPG operator), same reasoning as
# overlays/dev/postgres.yaml: staging doesn't need HA/backup (see
# README.md's "Node topology" section), and doesn't need CNPG's operator
# complexity either.
#
# Same secretKeyRef contract gami-webapp/gami-migrate already expect
# (`gami-postgres-app`, key `uri`) — see overlays/dev/postgres.yaml's
# header for the full explanation. `gami-postgres-app` needs to be created
# and sealed by hand here too (see overlays/staging/sealed-secrets/'s own
# comment) — not yet done for staging (I don't have access to the real
# hcloud cluster's sealed-secrets cert from this session).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gami-postgres
  labels:
    app: gami-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gami-postgres
  template:
    metadata:
      labels:
        app: gami-postgres
    spec:
      # Pinned to the staging node, alongside staging's webapp/api (see the
      # nodeAffinity patch below in this same overlay).
      nodeSelector:
        env: staging
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: gami-postgres-app
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "gami"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "gami"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gami-postgres-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gami-postgres-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gami-postgres
spec:
  selector:
    app: gami-postgres
  ports:
    - port: 5432
      targetPort: postgres
