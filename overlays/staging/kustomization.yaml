apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overrides base's `namespace: gami` — staging and production share one
# cluster (3-node k3s), so they need separate namespaces or resource names
# would collide.
namespace: gami-staging

resources:
  - ../../base
  - sealed-secrets
  - postgres-cluster.yaml

# See overlays/production/kustomization.yaml for why this is disabled.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: gami-config
    literals:
      - NODE_ENV=production
      - CORS_ALLOWED_ORIGIN=https://staging.authenticmemory.org
      - APP_BASE_URL=https://staging.authenticmemory.org
      - NEXTAUTH_URL=https://staging.authenticmemory.org
      - SECURE_COOKIES=true
      - AUTH_TRUST_HOST=true
      - SMTP_HOST=smtp.example.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_FROM=noreply@authenticmemory.org
      - SMTP_FROM_NAME=Authentic Memory (staging)
      - BOOTSTRAP_OPERATOR_EMAIL=tech@authenticmemory.org

images:
  - name: ghcr.io/authenticmemory/gami-webapp
    newTag: latest
  - name: ghcr.io/authenticmemory/gami-webapp-migrate
    newName: ghcr.io/authenticmemory/gami-webapp
    newTag: latest-migrate

replicas:
  - name: gami-webapp
    count: 1

# Staging gets its own hostnames and the Let's Encrypt STAGING ACME endpoint
# (untrusted-but-functional certs — avoids burning production's rate limits
# while iterating). See cluster-wide/cert-manager/cluster-issuers.yaml for
# both ClusterIssuers.
patches:
  # gami-migrate-job.yaml (base/) is an ArgoCD PreSync hook that reads this
  # ConfigMap via envFrom. sync-wave alone does NOT help here — PreSync is a
  # separate PHASE that runs entirely before the normal Sync phase, and
  # sync-wave only orders resources within the same phase; a Sync-phase
  # resource can never "jump ahead" of PreSync no matter its wave number
  # (confirmed against a real cluster: ArgoCD's own sync task list showed
  # only the Job attempted, gami-config not even queued yet, causing
  # "configmap gami-config not found" every time). The fix is making this
  # ConfigMap a PreSync hook too — same phase as the Job — ordered before it
  # via sync-wave -1 (the Job itself defaults to wave 0).
  - target:
      kind: ConfigMap
      name: gami-config
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: gami-config
        annotations:
          argocd.argoproj.io/hook: PreSync
          argocd.argoproj.io/sync-wave: "-1"
  - target:
      kind: Ingress
      name: gami-webapp
    patch: |
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: gami-webapp
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-staging
      spec:
        tls:
          - hosts:
              - staging.authenticmemory.org
              - verify-staging.authenticmemory.org
            secretName: gami-webapp-tls
        rules:
          - host: staging.authenticmemory.org
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: gami-webapp
                      port:
                        number: 3000
          - host: verify-staging.authenticmemory.org
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: gami-webapp
                      port:
                        number: 3000
  # Node topology (README.md): staging's own pod PREFERS the staging node —
  # a soft preference (preferredDuringScheduling), not a hard requirement,
  # so a temporarily-unschedulable staging node doesn't leave it Pending
  # forever. Deliberately different from production's podAntiAffinity
  # (overlays/production/kustomization.yaml), which spreads prod across all
  # 3 nodes for real redundancy — staging doesn't need that.
  - target:
      kind: Deployment
      name: gami-webapp
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: gami-webapp
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: env
                          operator: In
                          values: ["staging"]
