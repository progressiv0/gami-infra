apiVersion: v1
kind: Service
metadata:
  name: gami-api
  labels:
    app: gami-api
spec:
  # ClusterIP (default) — internal-only, same as Compose's "no host port".
  # gami-webapp is the only thing that ever calls this.
  selector:
    app: gami-api
  ports:
    - name: http
      port: 8080
      targetPort: http
