# Ordered via sync-wave, not an ArgoCD PreSync hook — PreSync hooks run in a
# phase that completes entirely before ANY Sync-phase resource is even
# attempted, including gami-config (also a plain Sync-phase resource this
# Job needs via envFrom), so a Job hook can never see that ConfigMap on a
# fresh namespace sync (confirmed against a real cluster: making gami-config
# a hook too didn't help either — its sync-wave was correctly rendered in
# the manifest, but ArgoCD's controller never classified it as a hook task,
# despite gitops-engine's IsHook() being purely annotation-based with no
# kind restriction — root cause undetermined, not worth more time chasing).
# Plain sync-wave ordering between ordinary resources is simpler and
# reliably documented ArgoCD behavior: gami-config (wave -1) → this Job
# (wave 0, this file) → gami-webapp's Deployment (wave 1, patched per
# overlay) — see overlays/*/kustomization.yaml.
#
# Without the PreSync hook, Replace=true (in each overlay's syncOptions) is
# what makes repeated syncs of this fixed-name Job idempotent — Jobs are
# immutable, so a plain `kubectl apply` on an already-completed
# `gami-migrate` fails; `kubectl replace --force` (what Replace=true drives)
# deletes and recreates it instead, mirroring the hook-delete-policy this
# used to rely on.
apiVersion: batch/v1
kind: Job
metadata:
  name: gami-migrate
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # Per-resource, not Application-wide: only this Job needs delete+recreate
    # semantics (Jobs are immutable) — Replace=true elsewhere would be
    # unnecessary and riskier (e.g. on the CNPG Cluster or Deployments).
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: gami-migrate
          # Symbolic name — rewritten by `kustomize edit set image` to the
          # real `gami-webapp:TAG-migrate` tag (the `builder` stage, which has
          # npm/drizzle-kit/tsx; the distroless runner doesn't). See
          # gami-app's release.yml.
          image: ghcr.io/authenticmemory/gami-webapp-migrate
          command: ["npm", "run", "db:setup"]
          envFrom:
            - configMapRef:
                name: gami-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gami-postgres-app
                  key: uri
          securityContext:
            runAsNonRoot: true
            # 1000 = the `node` user baked into node:22-alpine3.21 (the
            # builder stage's base image) — gami-webapp/Dockerfile switches
            # to it before WORKDIR so /app is actually writable by this uid,
            # verified empirically (this failed with EACCES before that fix).
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
