apiVersion: apps/v1
kind: Deployment
metadata:
  name: gami-webapp
  labels:
    app: gami-webapp
spec:
  # 1 everywhere — each environment is its own single-node cluster now, so
  # there's no node-spread HA to gain from more replicas (production used
  # to bump this to 3 via podAntiAffinity across 3 nodes; that topology is
  # gone). Safe to run >1 replica if that ever changes though:
  # src/instrumentation.ts's in-process OTS-upgrade
  # sweep (gami-app's src/lib/ots-upgrade.ts) has a single-instance overlap
  # guard the code's own comment says is safe to skip in multi-instance
  # deploys — a concurrent sweep from multiple replicas is idempotent
  # (just redundant calendar fetches, not data corruption).
  replicas: 1
  selector:
    matchLabels:
      app: gami-webapp
  template:
    metadata:
      labels:
        app: gami-webapp
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: gami-webapp
          # Tag is rewritten per-overlay by CI to a unique, immutable
          # `<branch>-<short-sha>` (see gami-app's release.yml /
          # deploy-production.yml). No imagePullPolicy override: the default
          # IfNotPresent is correct precisely because the tag never gets
          # reused, so a cached layer can't be stale.
          image: ghcr.io/authenticmemory/gami-webapp
          # Overrides the image's ENTRYPOINT (gami-webapp/entrypoint.sh), which
          # waits for Postgres, runs `drizzle-kit push` and seeds, THEN starts
          # the app — sensible for docker-compose, wrong here: gami-migrate-job
          # (sync-wave 0) already owns migrations, so leaving the entrypoint in
          # place would re-run a schema push on every pod start. `npm start` is
          # the last line of that script, minus the migrate/seed steps.
          command: ["npm", "start"]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: gami-config
          env:
            # NOTE: the app also syncs each signed GPR to disk next to its
            # database row (gami-webapp/src/lib/gpr-store.ts mkdir/writeFile's
            # at runtime), defaulting to <cwd>/gpr-store inside the image —
            # i.e. lost on every pod restart. Only the staging overlay wires
            # that to a real volume (GPR_STORE_DIR + a PVC, see
            # overlays/staging/); base deliberately leaves it unset so nothing
            # is silently persisted per-environment without opting in.
            # `gami-postgres-app` is produced differently per environment,
            # but the contract (key `uri`) is identical either way:
            #   staging    — generated on the cluster by Ansible's app_secrets
            #                role; the same Secret also initialises the plain
            #                Postgres container via envFrom.
            #   production — auto-generated by CNPG for the `gami-postgres`
            #                Cluster (overlays/production/database/). Verify
            #                the key name against your installed CNPG version;
            #                older ones expose host/user/password/dbname
            #                separately instead of a combined URI.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gami-postgres-app
                  key: uri
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: gami-secrets
                  key: NEXTAUTH_SECRET
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: gami-smtp
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: gami-smtp
                  key: SMTP_PASS
                  optional: true
          securityContext:
            runAsNonRoot: true
            # uid/gid 1000 = the `node` user that actually exists in the image
            # (node:22-alpine — see gami-webapp/Dockerfile's runtime stage).
            # 65532 is the distroless "nonroot" uid and has no passwd entry
            # here, which leaves HOME unset and npm writing to /.
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            # `next start` writes into .next/cache, and npm wants a writable
            # HOME — neither is possible under a read-only root, and the image
            # is a plain node:22-alpine, not a distroless static binary.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # /api/version is a static, dependency-free 200 (it just reports
          # BUILD_SHA) — deliberately NOT a DB-touching endpoint: the app
          # exposes no health route, and pointing a probe at something that
          # queries Postgres would take the whole Deployment down whenever the
          # database blips, rather than just the request that needed it.
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
