apiVersion: apps/v1
kind: Deployment
metadata:
  name: gami-webapp
  labels:
    app: gami-webapp
spec:
  # 1 everywhere — each environment is its own single-node cluster now, so
  # there's no node-spread HA to gain from more replicas (production used
  # to bump this to 3 via podAntiAffinity across 3 nodes; that topology is
  # gone). Safe to run >1 replica if that ever changes though:
  # src/instrumentation.ts's in-process OTS-upgrade
  # sweep (gami-app's src/lib/ots-upgrade.ts) has a single-instance overlap
  # guard the code's own comment says is safe to skip in multi-instance
  # deploys — a concurrent sweep from multiple replicas is idempotent
  # (just redundant calendar fetches, not data corruption).
  replicas: 1
  selector:
    matchLabels:
      app: gami-webapp
  template:
    metadata:
      labels:
        app: gami-webapp
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: gami-webapp
          # Tag set per-overlay via `kustomize edit set image` (release.yml).
          image: ghcr.io/authenticmemory/gami-webapp
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: gami-config
          env:
            # CNPG auto-generates this Secret for the `gami-postgres` Cluster
            # (each overlay's own postgres-cluster.yaml) — verify the exact
            # key name (`uri`) against your installed CNPG version; older
            # versions may only expose host/user/password/dbname as separate
            # keys instead of a combined connection string.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gami-postgres-app
                  key: uri
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: gami-secrets
                  key: NEXTAUTH_SECRET
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: gami-smtp
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: gami-smtp
                  key: SMTP_PASS
                  optional: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
