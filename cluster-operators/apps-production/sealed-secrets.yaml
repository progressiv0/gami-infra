# Child of the App-of-Apps parent (argocd/app-cluster-operators-production.yaml).
# Wave 0 — no dependency on the other operators. Applied against the
# registered remote "prod" cluster. This creates production's OWN Sealed
# Secrets controller with its OWN keypair, independent of staging's — every
# SealedSecret under overlays/production/webapp/sealed-secrets/ must be
# sealed against this controller's cert specifically.
#
# destination.namespace is set to kube-system to match reality, not chosen
# freely: the upstream controller.yaml hardcodes `namespace: kube-system` on
# every namespaced resource it defines, so ArgoCD's namespace override has
# no effect here regardless of what this field says (Kustomize/ArgoCD only
# inject a namespace onto resources that don't already declare one).
# -production suffix: this Application object lives in the argocd namespace
# on the LOCAL cluster (wherever ArgoCD itself runs), not on "prod" — only
# its own spec.destination below deploys there. staging currently has no
# sealed-secrets child (see apps-staging/kustomization.yaml's comment on
# why, and its warning that adding one later needs the controller added
# back first) — an unsuffixed name here would collide with that future
# addition, same as cert-manager.yaml's collision hit in practice.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-operators-sealed-secrets-production
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/progressiv0/gami-infra
    targetRevision: main
    path: cluster-operators/sealed-secrets
  destination:
    name: prod
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
