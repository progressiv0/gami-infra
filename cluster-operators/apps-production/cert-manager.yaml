# Child of the App-of-Apps parent (argocd/app-cluster-operators-production.yaml).
# Wave 0 — no dependencies. The Barman Cloud plugin (wave 1) needs
# cert-manager's Certificate/Issuer CRDs to already exist before it applies
# its own self-signed mTLS cert/issuer. Applied against the registered
# remote "prod" cluster. Source directory (cluster-operators/cert-manager/)
# is shared, cluster-agnostic — staging's copy of this Application
# (apps-staging/cert-manager.yaml) references the exact same path, just
# with a different destination.
#
# Name carries a -production suffix, unlike most other per-env Application
# names in this repo, because it WOULD collide: both this Application object
# and staging's cluster-operators-cert-manager live as Kubernetes objects in
# the SAME namespace (argocd) on the SAME cluster (wherever ArgoCD itself
# runs — staging; see roles/argocd/defaults/main.yml), regardless of which
# remote cluster their own spec.destination deploys cert-manager's actual
# resources to. Two Applications with the same (namespace, name) is a real
# conflict, not a cosmetic one — hit in practice as sync errors that kept
# shifting to a different resource each retry, traced to ArgoCD fighting
# itself over one object as each parent's selfHeal reasserted its own
# spec.destination.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-operators-cert-manager-production
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/progressiv0/gami-infra
    targetRevision: main
    path: cluster-operators/cert-manager
  destination:
    name: prod
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
