# Child of the App-of-Apps parent (argocd/app-cluster-operators-production.yaml).
# Wave 1 — depends on both cert-manager and CNPG (wave 0) already being
# up: this plugin issues its own mTLS Certificate/Issuer (needs
# cert-manager's CRDs) and registers with the CNPG operator (needs its CRDs)
# during install. Only in production's apps set — staging has no backup, so
# this plugin would be pure overhead there. Applied against the registered
# remote "prod" cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-operators-cnpg-barman-plugin
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/progressiv0/gami-infra
    targetRevision: main
    path: cluster-operators/cnpg-barman-plugin
  destination:
    name: prod
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
