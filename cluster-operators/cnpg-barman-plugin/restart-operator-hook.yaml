# ArgoCD PostSync hook: restarts the CNPG operator after every sync of this
# Application. Necessary because CNPG only discovers plugins ONCE, at
# operator startup — never dynamically (confirmed against CloudNativePG's
# own docs: https://cloudnative-pg.io/documentation/1.28/cnpg_i/, "If you
# deploy a new plugin, you must restart the operator to detect it."). Since
# cnpg (the operator, wave 0) necessarily installs before this plugin
# (wave 1) within cluster-operators-production, the operator's one-time
# plugin scan always runs before this plugin's Service exists — every
# fresh install, version bump, or config change here leaves the operator's
# in-memory plugin registry stale until something restarts it. Hit in
# practice on the very first production bootstrap: gami-postgres sat in
# "Cluster cannot proceed to reconciliation due to an error while
# interacting with plugins" / "produced zero addresses" until the operator
# was restarted by hand.
#
# PostSync, not a sync-wave: PostSync only fires once every ordinary
# resource in this Application's sync — including the plugin's own
# Deployment/Service — is Synced+Healthy, i.e. strictly after the plugin is
# actually reachable, not just "applied."
#
# hook-delete-policy: BeforeHookCreation, not the Replace=true,Force=true
# sync-options pattern base/gami-migrate-job.yaml uses — Jobs are
# immutable, and this hook re-fires on every sync of this Application (any
# future plugin version bump, config change, or drift-triggered selfHeal),
# so a fixed name needs the same delete-then-recreate handling for the same
# underlying reason. hook-delete-policy is ArgoCD's own purpose-built
# mechanism for exactly this, so it's used here instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-operator-restart-hook
  namespace: cnpg-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpg-operator-restart-hook
  namespace: cnpg-system
rules:
  # get+patch+watch on this one named Deployment is exactly what `kubectl
  # rollout restart` (patches the pod template's restartedAt annotation)
  # and `rollout status` (watches .status until the rollout completes)
  # need — nothing broader. resourceNames scopes it to this Deployment
  # only; note RBAC can't apply resourceNames to list/watch-without-a-name,
  # which is why list isn't granted here at all.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cnpg-controller-manager"]
    verbs: ["get", "patch", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg-operator-restart-hook
  namespace: cnpg-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cnpg-operator-restart-hook
subjects:
  - kind: ServiceAccount
    name: cnpg-operator-restart-hook
    namespace: cnpg-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cnpg-operator-restart-hook
  namespace: cnpg-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      name: cnpg-operator-restart-hook
    spec:
      serviceAccountName: cnpg-operator-restart-hook
      restartPolicy: Never
      containers:
        - name: kubectl
          # Pinned, not :latest, matching this repo's general convention.
          # Not tied to the cluster's own Kubernetes version — rollout
          # restart/status only touch the very stable apps/v1 Deployment
          # API, which tolerates normal kubectl version skew easily.
          image: bitnami/kubectl:1.31
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              kubectl -n cnpg-system rollout restart deployment/cnpg-controller-manager
              kubectl -n cnpg-system rollout status deployment/cnpg-controller-manager --timeout=120s
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
