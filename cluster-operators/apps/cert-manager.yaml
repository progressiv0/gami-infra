# Child of the App-of-Apps parent (argocd/app-cluster-operators.yaml) — see
# that file and cluster-operators/apps/kustomization.yaml for why sync-wave
# ordering only works nested under a parent, not as a standalone Application.
# Wave 0 — no dependencies. The Barman Cloud plugin (wave 1) needs
# cert-manager's Certificate/Issuer CRDs to already exist before it applies
# its own self-signed mTLS cert/issuer.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-operators-cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/progressiv0/gami-infra
    targetRevision: main
    path: cluster-operators/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
