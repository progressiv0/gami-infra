# Child of the App-of-Apps parent (argocd/app-cluster-operators.yaml) — see
# that file and cluster-operators/apps/kustomization.yaml for why sync-wave
# ordering only works nested under a parent, not as a standalone Application.
# Wave 0 — no dependency on cert-manager/CNPG, but the Barman plugin (wave 1)
# doesn't need Longhorn either, so this can sync alongside cert-manager/cnpg.
#
# ServerSideApply=true defensively, matching the CNPG Application — Longhorn
# ships 23 CRDs in one large manifest and hasn't been verified safe under
# plain client-side apply the way cert-manager's smaller manifest has been.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-operators-longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/progressiv0/gami-infra
    targetRevision: main
    path: cluster-operators/longhorn
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
