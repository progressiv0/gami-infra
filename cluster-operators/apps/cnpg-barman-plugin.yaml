# Child of the App-of-Apps parent (argocd/app-cluster-operators.yaml) — see
# that file and cluster-operators/apps/kustomization.yaml for why sync-wave
# ordering only works nested under a parent, not as a standalone Application.
# Wave 1 — depends on both cert-manager and CNPG (wave 0) already being
# up: this plugin issues its own mTLS Certificate/Issuer (needs
# cert-manager's CRDs) and registers with the CNPG operator (needs its CRDs)
# during install. Only needed for production's S3 backups — see
# overlays/production/postgres-cluster.yaml and
# overlays/production/README-backup.md. Dev/staging don't need this at all.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-operators-cnpg-barman-plugin
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/progressiv0/gami-infra
    targetRevision: main
    path: cluster-operators/cnpg-barman-plugin
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
