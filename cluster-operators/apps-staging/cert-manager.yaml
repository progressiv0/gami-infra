# Child of the App-of-Apps parent (argocd/app-cluster-operators-staging.yaml).
# Wave 0 — no dependencies. Applied locally, since ArgoCD itself runs on
# staging. Source directory (cluster-operators/cert-manager/) is shared,
# cluster-agnostic — production's copy of this Application (apps-production/
# cert-manager.yaml) references the exact same path, just with a different
# destination.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-operators-cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/progressiv0/gami-infra
    targetRevision: main
    path: cluster-operators/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
