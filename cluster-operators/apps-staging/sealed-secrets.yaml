# Child of the App-of-Apps parent (argocd/app-cluster-operators-staging.yaml).
# Wave 0 — no dependency on the other operators. Applied locally, since
# ArgoCD itself runs on staging. This creates staging's OWN Sealed Secrets
# controller with its OWN keypair, independent of production's — every
# SealedSecret under overlays/staging/sealed-secrets/ must be sealed against
# this controller's cert specifically.
#
# destination.namespace is set to kube-system to match reality, not chosen
# freely: the upstream controller.yaml hardcodes `namespace: kube-system` on
# every namespaced resource it defines, so ArgoCD's namespace override has
# no effect here regardless of what this field says (Kustomize/ArgoCD only
# inject a namespace onto resources that don't already declare one).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-operators-sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/progressiv0/gami-infra
    targetRevision: main
    path: cluster-operators/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
