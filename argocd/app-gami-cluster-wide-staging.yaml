# Cluster-scoped shared resources (currently: the two cert-manager
# ClusterIssuers) for staging's cluster — its own cert-manager instance
# needs its own ClusterIssuers. Applied locally, since ArgoCD itself runs
# on staging. destination.namespace is irrelevant for cluster-scoped
# resources but required by the Application schema.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gami-cluster-wide-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/progressiv0/gami-infra
    targetRevision: main
    path: cluster-wide
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
