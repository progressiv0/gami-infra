# Applied against the registered remote "prod" cluster, not the local one
# ArgoCD itself runs on (that's staging — see ansible/roles/argocd/tasks/
# register-remote-cluster.yml, which creates the "prod" cluster Secret this
# destination.name refers to).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gami-production-database
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/progressiv0/gami-infra
    targetRevision: main
    path: overlays/production/database
  destination:
    name: prod
    namespace: gami
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
