---
# Joins this node to the cluster the bootstrap node (site.yml's
# k3s_bootstrap_node) already initialized. `ansible_host` here is the
# bootstrap node's connection address as resolved by the dynamic inventory's
# `connect_with: private_ipv4` — i.e. its private network IP, not public.
- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Download and run the k3s install script (join)
  ansible.builtin.shell: |
    set -euo pipefail
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION={{ k3s_version }} \
      K3S_URL="https://{{ hostvars[k3s_bootstrap_node].ansible_host }}:6443" \
      K3S_TOKEN="{{ hostvars[k3s_bootstrap_node].k3s_node_token }}" \
      INSTALL_K3S_EXEC="server --disable={{ k3s_disable | join(',') }} --node-label env={{ hostvars[inventory_hostname].hcloud_labels.env }}" \
      sh -
  args:
    executable: /bin/bash
  when: not k3s_binary.stat.exists

- name: Wait for this node to report Ready
  ansible.builtin.command: k3s kubectl get node {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: k3s_ready
  until: k3s_ready.stdout == "True"
  retries: 30
  delay: 10
  changed_when: false
