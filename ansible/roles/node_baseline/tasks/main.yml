---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Create non-root ops user
  ansible.builtin.user:
    name: ops
    groups: sudo
    shell: /bin/bash
    create_home: true

- name: Require ssh_public_key_path (no key means ops is locked out)
  ansible.builtin.assert:
    that: ssh_public_key_path is defined
    fail_msg: >-
      ssh_public_key_path is not set. This must point at the public key
      you'll use to connect as ops afterward (same one Terraform put on
      root) — pass it with -e ssh_public_key_path=~/.ssh/id_ed25519.pub.
      Without it, ops is created with no key and you'll be locked out.

- name: Install the ops SSH key (same one Terraform put on root)
  ansible.posix.authorized_key:
    user: ops
    key: "{{ lookup('file', ssh_public_key_path) }}"

- name: Allow passwordless sudo for ops
  ansible.builtin.copy:
    dest: /etc/sudoers.d/ops
    content: "ops ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: "visudo -cf %s"

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

# Hetzner's cloud firewall (terraform/main.tf) is the primary boundary — this
# is defense in depth, not the only layer, and deliberately mirrors those
# same rules rather than introducing a second, divergent source of truth.
- name: Configure host firewall (ufw) — mirrors the Hetzner cloud firewall
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"
    - "80"
    - "443"
    - "6443"

# ArgoCD's web UI NodePort — staging only, since that's the one node ArgoCD
# runs on (see roles/argocd/files/traefik-argocd-entrypoint.yaml, where 30443
# is pinned). The Hetzner firewall is what restricts this to admin_ip_cidr
# (terraform/main.tf's argocd_ui firewall); like every rule above, this layer
# just opens the port and lets the cloud firewall scope the source.
- name: Allow the ArgoCD UI NodePort (staging only)
  community.general.ufw:
    rule: allow
    port: "30443"
    proto: tcp
  when: hostvars[inventory_hostname].hcloud_labels.env == 'staging'

- name: Enable ufw
  community.general.ufw:
    state: enabled
    policy: deny
