argocd_install_url: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
argocd_namespace: argocd
# Controller-side path — where the manifests live in this checkout.
argocd_app_path: "{{ project_root }}/argocd"
# Target-side path — where those manifests get staged on the node. Every
# task here shells out to `k3s kubectl` ON the node, so every `-f` path has
# to exist THERE, not on the Ansible controller. These are the same machine
# under playbooks/local.yml (connection: local) but NOT under site.yml,
# which reaches both nodes over SSH — hence the copy-then-apply pattern in
# tasks/main.yml rather than applying argocd_app_path directly.
argocd_remote_dir: /opt/gami-infra
argocd_wait_retries: 30
argocd_wait_delay: 10

# Must match the repoURL every argocd/*.yaml and cluster-operators/apps-*/
# *.yaml Application hardcodes. If that repo is private, ArgoCD (running on
# staging) needs credentials to clone it — see tasks/repo-credentials.yml,
# sourced from GAMI_INFRA_REPO_TOKEN/GAMI_INFRA_REPO_USERNAME env vars. Only
# one cluster ever needs this: argocd-repo-server always runs on staging
# (see README.md) and does the cloning for both clusters' Applications,
# regardless of which cluster a given Application's destination is.
argocd_repo_url: https://github.com/progressiv0/gami-infra

# ArgoCD installs once, on staging, and manages BOTH clusters from there —
# staging locally (destination.server: https://kubernetes.default.svc,
# unchanged), production as a registered remote cluster (see
# tasks/register-remote-cluster.yml). These two lists are which Application
# manifests get applied against each destination.
#
# Local playbooks (local.yml) override argocd_local_apps to the
# app-*-staging.yaml set (same files, since local mirrors staging) and set
# argocd_remote_apps: [] — a local rig is single-cluster, nothing to
# register.
argocd_local_apps:
  - app-cluster-operators-staging.yaml
  - app-gami-cluster-wide-staging.yaml
  - app-gami-staging.yaml

# "production-database" (not "production-webapp"): production's Postgres
# (overlays/production/database/, single-instance CNPG + S3 backup) is
# deployed now, ahead of its web app — the app's branches/images aren't
# ready yet. app-gami-production-webapp.yaml is deliberately left out until
# then; add it to this list once ready, no other change needed.
argocd_remote_apps:
  - app-cluster-operators-production.yaml
  - app-gami-cluster-wide-production.yaml
  - app-gami-production-database.yaml

# Dedicated Traefik entrypoint for the ArgoCD UI/API — kept off 80/443,
# which are reserved for gami-webapp. Must match the port hardcoded in
# files/traefik-argocd-entrypoint.yaml and files/ingressroute.yaml.
argocd_ingress_port: 8443
