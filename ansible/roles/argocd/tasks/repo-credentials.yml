---
# Registers this repo's git credentials with ArgoCD, declaratively — the
# standard ArgoCD pattern: a Secret in its own namespace, labeled
# argocd.argoproj.io/secret-type: repository. Needed only if
# argocd_repo_url (defaults/main.yml) is a PRIVATE repo; skipped entirely
# (no-op) if GAMI_INFRA_REPO_TOKEN isn't set, so a public-repo fork of this
# project needs no extra setup. This is the manual step that used to be
# done by hand outside of git — see README.md.
- name: Read repo credentials from the environment
  ansible.builtin.set_fact:
    gami_infra_repo_token: "{{ lookup('env', 'GAMI_INFRA_REPO_TOKEN') }}"
    gami_infra_repo_username: "{{ lookup('env', 'GAMI_INFRA_REPO_USERNAME') | default('git', true) }}"

- name: Render the ArgoCD repo-credentials Secret
  ansible.builtin.template:
    src: repo-credentials-secret.yaml.j2
    dest: /tmp/argocd-repo-credentials-secret.yaml
    mode: "0600"
  when: gami_infra_repo_token | length > 0

- name: Apply the repo-credentials Secret
  ansible.builtin.command:
    cmd: k3s kubectl apply -f /tmp/argocd-repo-credentials-secret.yaml
  when: gami_infra_repo_token | length > 0
  changed_when: true
