---
# Bootstraps a single-node embedded-etcd k3s server. Run identically and
# independently on every node — nothing ever joins this instance (each node
# is its own fully separate k3s installation). Idempotent: the k3s install
# script checks for an existing /usr/local/bin/k3s and an active k3s.service
# before doing anything, so re-running this is a no-op once installed.
- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

# --tls-san so a node with a private-network address (argocd_link_ip in
# inventory/production.yml — today only gami-prod) issues its server
# certificate with that IP in the SAN list. Without it, staging's ArgoCD
# fails TLS verification connecting to prod over 10.10.0.3: Terraform
# created that network AFTER k3s had already generated its certs from
# whatever IPs existed at install time, and k3s never revisits the SAN
# list on its own — only a flag change + restart regenerates it (see
# tasks/main.yml's re-apply-tls-san.yml for doing this on an
# already-installed node without a full reinstall).
- name: Download and run the k3s install script (cluster-init)
  ansible.builtin.shell: |
    set -euo pipefail
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION={{ k3s_version }} \
      INSTALL_K3S_EXEC="server --cluster-init --disable={{ k3s_disable | join(',') }} --node-label env={{ hostvars[inventory_hostname].hcloud_labels.env }}{{ ' --tls-san=' + hostvars[inventory_hostname].argocd_link_ip if hostvars[inventory_hostname].argocd_link_ip is defined else '' }}" \
      sh -
  args:
    executable: /bin/bash
  when: not k3s_binary.stat.exists
  changed_when: true

- name: Wait for k3s to report Ready
  ansible.builtin.command: k3s kubectl get node {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: k3s_ready
  until: k3s_ready.stdout == "True"
  retries: 30
  delay: 10
  changed_when: false
