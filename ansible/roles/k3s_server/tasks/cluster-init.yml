---
# Bootstraps a single-node embedded-etcd k3s server. Run identically and
# independently on every node — nothing ever joins this instance (each node
# is its own fully separate k3s installation). Idempotent: the k3s install
# script checks for an existing /usr/local/bin/k3s and an active k3s.service
# before doing anything, so re-running this is a no-op once installed.
- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Download and run the k3s install script (cluster-init)
  ansible.builtin.shell: |
    set -euo pipefail
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION={{ k3s_version }} \
      INSTALL_K3S_EXEC="server --cluster-init --disable={{ k3s_disable | join(',') }} --node-label env={{ hostvars[inventory_hostname].hcloud_labels.env }}" \
      sh -
  args:
    executable: /bin/bash
  when: not k3s_binary.stat.exists
  changed_when: true

- name: Wait for k3s to report Ready
  ansible.builtin.command: k3s kubectl get node {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: k3s_ready
  until: k3s_ready.stdout == "True"
  retries: 30
  delay: 10
  changed_when: false
