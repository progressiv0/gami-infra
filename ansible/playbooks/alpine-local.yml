# Local test-rig equivalent of site.yml, targeting the 3 Alpine VMs in
# inventory/alpine-local.yml. Skips node-baseline on purpose — that role is
# apt/ufw/sudo and written for production's real Debian/Ubuntu Hetzner nodes
# (see ansible/roles/node-baseline/tasks/main.yml), not this throwaway rig.
#
# Only gami-dev gets deployed here — deliberately not staging/production.
# Running all three environments simultaneously on 3 small test VMs is what
# caused this repo's repeated disk-pressure/Longhorn-scheduling/redis-evicted
# problems; a local rig only needs one environment to exercise the
# infrastructure itself. See argocd_gami_environments below.
- name: Bootstrap the first k3s server (cluster-init)
  hosts: k3s_server
  become: true
  run_once: true
  vars:
    k3s_bootstrap_node: "{{ groups['k3s_server'] | sort | first }}"
  tasks:
    - name: Delegate cluster-init to the pinned first node
      block:
        - name: Include k3s-server cluster-init tasks
          ansible.builtin.include_role:
            name: k3s-server
            tasks_from: cluster-init.yml
      delegate_to: "{{ k3s_bootstrap_node }}"
      run_once: true

- name: Join the remaining nodes to the cluster
  hosts: k3s_server
  become: true
  vars:
    k3s_bootstrap_node: "{{ groups['k3s_server'] | sort | first }}"
  tasks:
    - name: Join this node (skipped on the bootstrap node itself)
      ansible.builtin.include_role:
        name: k3s-server
        tasks_from: join.yml
      when: inventory_hostname != k3s_bootstrap_node

- name: Install ArgoCD on the bootstrap node
  hosts: k3s_server
  become: true
  run_once: true
  vars:
    k3s_bootstrap_node: "{{ groups['k3s_server'] | sort | first }}"
    project_root: "{{ playbook_dir }}/../.."
    # Overrides the role default (staging + production, matching real
    # hcloud) — see this file's header comment and
    # roles/argocd/defaults/main.yml for why local rigs only run dev.
    argocd_gami_environments:
      - dev
  tasks:
    - name: Install ArgoCD (delegated to the bootstrap node)
      block:
        - name: Include argocd tasks
          ansible.builtin.include_role:
            name: argocd
      delegate_to: "{{ k3s_bootstrap_node }}"
      run_once: true
