---
# Restore a pg_dump custom-format file into one environment's database.
#
#   ansible-playbook -i inventory/production.yml playbooks/db-restore.yml \
#     --limit gami-staging \
#     -e database_restore_file=../dumps/gami-20260820T1200.dump \
#     -e database_restore_confirm=true
#
# DESTRUCTIVE. Read docs/database.md's "Restoring a dump" first — in
# particular, disable the target Application's auto-sync before restoring,
# or ArgoCD will re-run the migrate Job (drizzle-kit push) over your
# restored data.
#
# --limit is not optional here. Without it this would restore the same dump
# onto BOTH environments.
- name: Restore a dump into the environment's Postgres database
  hosts: k3s_server
  become: true
  gather_facts: true
  tasks:
    - name: Refuse to run against more than one host at a time
      ansible.builtin.assert:
        that: ansible_play_hosts | length == 1
        fail_msg: >-
          This playbook targets {{ ansible_play_hosts | length }} hosts
          ({{ ansible_play_hosts | join(', ') }}). Pass --limit gami-staging
          (or --limit gami-prod) — restoring one dump onto both environments
          is never intended.
      run_once: true

    - name: Restore (staging — plain Postgres Deployment)
      ansible.builtin.include_role:
        name: database
        tasks_from: restore.yml
      vars:
        database_kind: deployment
        database_namespace: gami-staging
        database_superuser: gami
      when: hostvars[inventory_hostname].hcloud_labels.env == 'staging'

    - name: Restore (production — CloudNativePG)
      ansible.builtin.include_role:
        name: database
        tasks_from: restore.yml
      vars:
        database_kind: cnpg
        database_namespace: gami
        database_superuser: postgres
      when: hostvars[inventory_hostname].hcloud_labels.env == 'prod'
