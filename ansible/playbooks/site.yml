# Idempotent — safe to re-run. This is how a new node gets added (add to
# terraform/variables.tf + ansible/inventory/production.yml, re-run
# site.yml) or an existing one gets reconciled after drift.
#
# Each node bootstraps its own fully independent, unjoined k3s installation
# — there's no bootstrap/join two-phase dance anymore (see git history for
# the old 3-node joined-cluster version of this file if you need it). ArgoCD
# installs on staging only and manages production as a registered remote
# cluster — see roles/argocd/tasks/register-remote-cluster.yml.
#
# Every play is tagged, so a full run is rarely necessary once a node is up:
#
#   --tags argocd        just ArgoCD (install + register prod)
#   --tags register-prod just the remote-cluster registration
#   --tags secrets       both secret plays (app_secrets + GHCR pull secret)
#   --tags ghcr          just the GHCR pull secret — the rotation path
#   --tags app-secrets   just staging's generated Postgres/app Secrets
#   --tags baseline      just the node baseline (users, ufw, unattended-upgrades)
#   --tags k3s           just the k3s install
#
# --skip-tags takes the same names, and --limit gami-staging narrows to one
# node. `--list-tasks` (optionally with --tags) prints what a given invocation
# would do without connecting to anything.
- name: Configure node baseline (all nodes)
  hosts: k3s_server
  become: true
  tags: [baseline]
  roles:
    - node_baseline

- name: Bootstrap k3s on every node independently (single-node embedded-etcd)
  hosts: k3s_server
  become: true
  tags: [k3s]
  roles:
    - k3s_server

# Before ArgoCD, so the Secrets exist the first time it syncs the staging
# overlay — otherwise gami-postgres/gami-webapp/gami-migrate all sit in
# CreateContainerConfigError until the next sync. Generate-once and never
# rotated on re-runs; see the role for why.
- name: Generate staging's application secrets
  hosts: env_staging
  become: true
  run_once: true
  tags: [secrets, app-secrets]
  roles:
    - app_secrets

# Both clusters, not just staging: imagePullSecrets is resolved in the pod's
# own namespace, so each cluster needs its own copy in its own app namespace.
# Production gets one now even though app-gami-production-webapp.yaml isn't
# in argocd_remote_apps yet — so bringing it online later stays the one-line
# change that file's comment promises.
- name: Install the GHCR image pull secret on both clusters
  hosts: k3s_server
  become: true
  tags: [secrets, ghcr]
  roles:
    - role: image_pull_secret
      image_pull_secret_namespace: >-
        {{ 'gami-staging'
           if hostvars[inventory_hostname].hcloud_labels.env == 'staging'
           else 'gami' }}

- name: Install ArgoCD on staging (the one central instance)
  hosts: env_staging
  become: true
  run_once: true
  tags: [argocd]
  vars:
    project_root: "{{ playbook_dir }}/../.."
  roles:
    - argocd

- name: Register production as a remote cluster in staging's ArgoCD
  hosts: env_staging
  become: true
  run_once: true
  tags: [argocd, register-prod]
  vars:
    project_root: "{{ playbook_dir }}/../.."
    prod_node: "{{ groups['env_prod'] | first }}"
  tasks:
    - name: Include register-remote-cluster tasks
      ansible.builtin.include_role:
        name: argocd
        tasks_from: register-remote-cluster.yml
