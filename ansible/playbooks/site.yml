# Idempotent — safe to re-run. This is how new nodes get added (add to
# Terraform, re-run site.yml) or existing ones get reconciled after drift.
#
# Node ordering matters for embedded-etcd bootstrap: node 1 initializes the
# cluster (--cluster-init), nodes 2/3 join it (--server https://<node1>:6443).
# `ansible_play_batch`/group order from the hcloud dynamic inventory isn't
# guaranteed stable across runs, so this pins "first node alphabetically by
# Terraform-assigned name" as node 1 rather than relying on inventory order.
- name: Configure node baseline (all nodes)
  hosts: k3s_server
  become: true
  roles:
    - node-baseline

- name: Bootstrap the first k3s server (cluster-init)
  hosts: k3s_server
  become: true
  run_once: true
  # Pins node 1 deterministically instead of trusting inventory ordering.
  vars:
    k3s_bootstrap_node: "{{ groups['k3s_server'] | sort | first }}"
  tasks:
    - name: Delegate cluster-init to the pinned first node
      ansible.builtin.include_role:
        name: k3s-server
        tasks_from: cluster-init.yml
      delegate_to: "{{ k3s_bootstrap_node }}"
      run_once: true

- name: Join the remaining nodes to the cluster
  hosts: k3s_server
  become: true
  vars:
    k3s_bootstrap_node: "{{ groups['k3s_server'] | sort | first }}"
  tasks:
    - name: Join this node (skipped on the bootstrap node itself)
      ansible.builtin.include_role:
        name: k3s-server
        tasks_from: join.yml
      when: inventory_hostname != k3s_bootstrap_node
