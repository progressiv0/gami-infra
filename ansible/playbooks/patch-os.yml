# On-demand OS patching, one node at a time. Each node is its own
# single-node cluster now — there's no etcd quorum shared across nodes to
# protect, and nowhere to drain a node's workloads *to* within its own
# cluster, so this no longer drains/uncordons (that delegate_to-a-sibling
# pattern only made sense when nodes were peers in one shared cluster).
# `serial: 1` stays anyway, purely as a light habit — don't reboot staging
# and production in the same instant — not for any quorum reason.
- name: Patch OS packages and reboot if needed (one node at a time)
  hosts: k3s_server
  become: true
  serial: 1
  tasks:
    - name: Update apt cache and upgrade packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: safe
      register: apt_upgrade

    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot
      ansible.builtin.reboot:
        reboot_timeout: 300
      when: reboot_required.stat.exists
